name: Django CI

# Trigger the workflow on push or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your repository into the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Install your Django application dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Check for production configuration flaws
    - name: Run Django Deployment Check
      run: python manage.py check --deploy

    # 5. Execute your unit tests
    - name: Run Tests
      run: python manage.py test
